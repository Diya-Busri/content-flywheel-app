<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Black background circle -->
  <circle cx="100" cy="100" r="100" fill="#000000"/>

  <!-- Orange glow ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#f97316" stroke-width="4"/>

  <!-- Orange outer glow (subtle) -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.4"/>

  <!-- White "C" letter -->
  <text x="55" y="118" font-family="Arial Black, Impact, sans-serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="-2">C</text>

  <!-- Orange "F" letter -->
  <text x="102" y="118" font-family="Arial Black, Impact, sans-serif" font-size="72" font-weight="900" fill="#f97316" letter-spacing="-2">F</text>

  <!-- "CONTENT" text -->
  <text x="100" y="142" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="4">CONTENT</text>

  <!-- "FLYWHEEL" text in orange -->
  <text x="100" y="160" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#f97316" text-anchor="middle" letter-spacing="4">FLYWHEEL</text>

  <!-- Bottom accent line -->
  <line x1="70" y1="167" x2="130" y2="167" stroke="#f97316" stroke-width="1.5" opacity="0.6"/>
</svg>
