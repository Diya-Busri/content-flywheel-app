<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%"  stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  
  </defs>
  
    <rect width="1080" height="1920" fill="url(#bg)"/>
    <!-- label chip -->
    <rect x="60" y="80" width="265" height="52" rx="26" fill="rgba(0,0,0,0.5)" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="193" y="113" font-family="ui-sans-serif,sans-serif" font-size="20" font-weight="700"
          fill="#34d399" letter-spacing="2" text-anchor="middle">PRODUCT MOCKUP</text>
    <text x="1020" y="116" font-family="ui-sans-serif,sans-serif" font-size="26"
          fill="rgba(255,255,255,0.4)" font-weight="600" text-anchor="end" letter-spacing="2">3</text>

    <!-- Book shadow -->
    <rect x="180" y="400" width="720" height="900" rx="18" fill="#000" opacity="0.35" filter="url(#shadow)"/>
    <!-- Book cover -->
    <rect x="180" y="400" width="720" height="900" rx="18" fill="url(#cover)"/>
    <!-- Spine highlight -->
    <rect x="180" y="400" width="28" height="900" rx="18" fill="rgba(255,255,255,0.15)"/>
    <!-- Cover texture lines -->
    <line x1="240" y1="480"  x2="840" y2="480"  stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
    <line x1="240" y1="510" x2="840" y2="510" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <!-- Title area -->
    <rect x="240" y="550" width="600" height="220" rx="10" fill="rgba(0,0,0,0.25)"/>
    <text x="540" y="630" font-family="ui-sans-serif,sans-serif" font-size="36"
          font-weight="900" fill="#fff" text-anchor="middle">CONTENT</text>
    <text x="540" y="680" font-family="ui-sans-serif,sans-serif" font-size="36"
          font-weight="900" fill="#fff" text-anchor="middle">FLYWHEEL</text>
    <text x="540" y="734" font-family="ui-sans-serif,sans-serif" font-size="22"
          font-weight="600" fill="rgba(255,255,255,0.7)" text-anchor="middle">Complete Guide</text>
    <!-- Divider -->
    <line x1="300" y1="800" x2="780" y2="800" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <!-- Body text lines (fake) -->
    <rect x="260" y="840" width="560" height="18" rx="9" fill="rgba(255,255,255,0.2)"/><rect x="260" y="890" width="520" height="18" rx="9" fill="rgba(255,255,255,0.2)"/><rect x="260" y="940" width="560" height="18" rx="9" fill="rgba(255,255,255,0.2)"/><rect x="260" y="990" width="520" height="18" rx="9" fill="rgba(255,255,255,0.2)"/><rect x="260" y="1040" width="560" height="18" rx="9" fill="rgba(255,255,255,0.2)"/><rect x="260" y="1090" width="520" height="18" rx="9" fill="rgba(255,255,255,0.2)"/>
    <!-- Star rating -->
    <text x="540" y="1220" font-family="ui-sans-serif,sans-serif" font-size="42"
          text-anchor="middle">⭐⭐⭐⭐⭐</text>
    <!-- Price tag -->
    <rect x="440" y="1200" width="200" height="60" rx="30"
          fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <text x="540" y="1238" font-family="ui-monospace,monospace"
          font-size="26" font-weight="800" fill="#fff" text-anchor="middle">$27</text>

    <!-- Below-book caption -->
    <text x="540" y="1380" font-family="ui-sans-serif,sans-serif" font-size="30"
          font-weight="700" fill="rgba(255,255,255,0.6)" text-anchor="middle">Digital Product</text>

    <!-- Bottom accent stripe -->
    <rect x="0" y="1914" width="1080" height="6" fill="#34d399" opacity="0.7"/>
  
  <!-- placeholder:scene_3 -->
</svg>