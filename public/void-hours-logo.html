<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Void Hours Logo</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 24px; }

  .logo-wrap {
    background: #000;
    width: 400px;
    height: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }

  .ring {
    width: 90px;
    height: 90px;
  }

  .wordmark {
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: 18px;
    color: #ffffff;
    letter-spacing: 10px;
    text-indent: 10px;
    white-space: nowrap;
  }

  canvas { display: none; }

  .btn {
    background: #f97316;
    color: white;
    border: none;
    padding: 12px 28px;
    border-radius: 8px;
    font-size: 14px;
    font-family: sans-serif;
    cursor: pointer;
    font-weight: 600;
  }
  .btn:hover { background: #ea6c0a; }
  p { color: #666; font-family: sans-serif; font-size: 12px; }
</style>
</head>
<body>

<div class="logo-wrap" id="logoBox">
  <!-- Ring SVG with gap at top -->
  <svg class="ring" viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="45" cy="45" r="40"
      stroke="white"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-dasharray="241"
      stroke-dashoffset="14"
      transform="rotate(-90 45 45)"
    />
  </svg>
  <div class="wordmark">VOID HOURS</div>
</div>

<button class="btn" onclick="downloadPNG()">⬇ Download PNG (1000×1000)</button>
<p>Right-click the logo box → Save image, or use the button above</p>

<canvas id="c" width="1000" height="1000"></canvas>

<script>
function downloadPNG() {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const size = 1000;

  // Background
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, size, size);

  // Ring
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  const cx = 500, cy = 430, r = 110;
  const gapAngle = 0.18; // radians — gap at top
  ctx.beginPath();
  ctx.arc(cx, cy, r, -Math.PI/2 + gapAngle/2, -Math.PI/2 - gapAngle/2 + Math.PI*2);
  ctx.stroke();

  // Text
  ctx.fillStyle = '#ffffff';
  ctx.font = '200 44px Raleway, "Century Gothic", sans-serif';
  ctx.textAlign = 'center';
  ctx.letterSpacing = '18px';
  ctx.fillText('VOID HOURS', 509, 620);

  // Download
  const link = document.createElement('a');
  link.download = 'void-hours-logo.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}
</script>

</body>
</html>
