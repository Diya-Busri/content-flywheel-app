<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Transparent background — white elements for use on dark backgrounds -->

  <!-- Thin circle with gap at top -->
  <circle
    cx="200"
    cy="165"
    r="52"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.4"
    stroke-linecap="round"
    stroke-dasharray="314"
    stroke-dashoffset="18"
    transform="rotate(-90 200 165)"
  />

  <!-- VOID HOURS text -->
  <text
    x="200"
    y="258"
    text-anchor="middle"
    fill="#ffffff"
    font-family="'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif"
    font-size="28"
